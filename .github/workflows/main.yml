name: Build LineageOS ROM


on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://github.com/LineageOS/android.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'lineage-16.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://gitee.com/xinkontans/lineage_device_mt8167.git'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'master'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/EEBBK/S1S'
      VENDOR_BLOBS_URL:
        description: 'VENDOR_BLOBS_URL'
        required: false
        default: 'https://gitee.com/xinkontans/android_vendor_EEBBK_S1S.git'
      VENDOR_BRANCH:
        description: 'VENDOR_BRANCH'
        required: false
        default: 'cm-14.1'
      VENDOR_PATH:
        description: 'VENDOR_PATH'
        required: true
        default: 'vendor/EEBBK/S1S'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'S1S'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'S1S-userdebug'

jobs:
  build-lineageos:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Check if sender is repository owner
      if: github.event.repository.owner.login == github.event.sender.login
      run: |
        echo "Sender is the repository owner"
    - name: Not the repository owner
      if: github.event.repository.owner.login != github.event.sender.login
      run: |
        echo "Sender is not the repository owner"
        exit 1
      
    - name: Cleanup
      run: |
        sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache
        sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 || true

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt install git aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
        sudo apt-get install git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libxml2-utils xsltproc unzip fontconfig repo libncurses5 -y
        mkdir ${{ steps.pwd.outputs.workspace-folder }}/ccache
        export USE_CCACHE=1
        export CCACHE_DIR=${{ steps.pwd.outputs.workspace-folder }}/ccache/
        ccache -M 1G
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '9'
        distribution: 'zulu'
        
    - name: Check Java version
      run: java -version

    - name: Clone and sync Lineage sources
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        mkdir lineage
        cd lineage
        repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
        git config --global http.maxRequests 2
        sync_ok=false
        for attempt in 1 2 3 4; do
          echo "repo sync attempt ${attempt}/4"
          if repo sync -c -j4 --fail-fast --retry-fetches=3; then
            sync_ok=true
            break
          fi
          sleep $((attempt * 30))
        done
        if [ "$sync_ok" != true ]; then
          echo "repo sync failed after 4 attempts"
          exit 1
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        git clone ${{ github.event.inputs.VENDOR_BLOBS_URL }} -b ${{ github.event.inputs.VENDOR_BRANCH }} ./${{ github.event.inputs.VENDOR_PATH }}
        # Merge proprietary blobs from gitee mirror (VENDOR_BLOBS_URL hosts patched mks only)
        git clone https://gitee.com/xinkontans/android_vendor_EEBBK_S1S.git -b cm-14.1 /tmp/vendor_full || true
        if [ -d /tmp/vendor_full/proprietary ]; then cp -r /tmp/vendor_full/proprietary ./${{ github.event.inputs.VENDOR_PATH }}/; echo "proprietary merged"; fi
        rm -rf /tmp/vendor_full
        # LOS16 manifest comments out prebuilts/lineage-sdk, but checkpublicapi needs it
        git clone -b lineage-16.0 --depth 1 https://github.com/LineageOS/android_prebuilts_lineage-sdk.git prebuilts/lineage-sdk || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Patch LOS16 lineage-sdk Make compatibility variables
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage
        python3 - <<'PY'
        from pathlib import Path

        path = Path('lineage-sdk/Android.mk')
        text = path.read_text()
        backslash = chr(92)
        needle = 'lineage_platform_res := APPS/org.lineageos.platform-res_intermediates/aapt\n'
        patch = '\n'.join([
            'lineage_sdk_src := sdk/src/java/lineageos',
            'lineage_sdk_internal_src := sdk/src/java/org/lineageos/internal',
            'library_src := lineage/lib/main/java',
            '',
            'lineage_sdk_LOCAL_JAVA_LIBRARIES := ' + backslash,
            '    android-support-annotations ' + backslash,
            '    android-support-v7-preference ' + backslash,
            '    android-support-v7-recyclerview ' + backslash,
            '    android-support-v14-preference',
            '',
            'lineage_platform_LOCAL_INTERMEDIATE_SOURCES := ' + backslash,
            '    $(lineage_platform_res)/lineageos/platform/R.java ' + backslash,
            '    $(lineage_platform_res)/lineageos/platform/Manifest.java ' + backslash,
            '    $(lineage_platform_res)/org/lineageos/platform/internal/R.java',
            '',
            'lineage_sdk_LOCAL_INTERMEDIATE_SOURCES := ' + backslash,
            '    $(lineage_platform_res)/lineageos/platform/R.java ' + backslash,
            '    $(lineage_platform_res)/lineageos/platform/Manifest.java',
        ])
        if 'lineage_sdk_src := sdk/src/java/lineageos' in text:
            print('Make compatibility variables already present')
        elif needle not in text:
            raise SystemExit('lineage-sdk Android.mk needle not found')
        else:
            text = text.replace(needle, needle + '\n' + patch.rstrip() + '\n', 1)
            path.write_text(text)
            print('Restored lineage-sdk Make compatibility variables')
        print('--- compatibility block ---')
        lines = path.read_text().splitlines()
        for i, line in enumerate(lines):
            if line.startswith('lineage_sdk_src :='):
                print('\n'.join(lines[i:i+18]))
                break
        PY
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repair WebView prebuilts
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage
        git -C external/chromium-webview/prebuilt/arm lfs pull --include=webview.apk
        git -C external/chromium-webview/prebuilt/arm64 lfs pull --include=webview.apk
        python3 -c "import zipfile; [zipfile.ZipFile(p).testzip() for p in ['external/chromium-webview/prebuilt/arm/webview.apk','external/chromium-webview/prebuilt/arm64/webview.apk']]"
        sha256sum external/chromium-webview/prebuilt/arm/webview.apk external/chromium-webview/prebuilt/arm64/webview.apk
        echo "Repo metadata before cleanup:"
        du -sh .repo || true
        rm -rf .repo
        echo "Disk after repo metadata cleanup:"
        df -h .
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
        
    - name: Switch to Python2
      run: |
        sudo add-apt-repository universe -y
        sudo apt update
        sudo apt install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python
      continue-on-error: true

    - name: Build Lineage ROM
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        . build/envsetup.sh
        export USE_CCACHE=1
        export CCACHE_DIR=ccache/
        ccache -M 1G
        sudo apt-get clean || true
        rm -rf /home/runner/.cache/* || true
        echo "Disk after cleanup:"
        df -h .
        available_kb=$(df --output=avail . | tail -1)
        if [ "$available_kb" -lt 20971520 ]; then
          echo "Insufficient disk space before compile: ${available_kb} KB available"
          exit 1
        fi
        export USE_CCACHE=0
        rm -rf ccache
        sudo rm -rf /root/.cache/* /home/runner/.cache/* /var/cache/apt/* || true
        echo "Disk after ccache cleanup:"
        df -h .
        echo "Build diagnostics before compile:"
        nproc
        free -h
        df -h .
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}
        set +e
        set -o pipefail
        m -j4
        build_status=$?
        echo "Build diagnostics after compile:"
        free -h
        df -h .
        exit "$build_status"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Check build output (fail if no ROM zip)
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
        ls -al
        if ls *.zip >/dev/null 2>&1; then echo "ROM zip found:"; ls *.zip; else echo "NO ROM ZIP - build failed"; exit 1; fi
      continue-on-error: false

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
        
# trigger rescan


